{% extends "base.html" %}

{% block title %}注册 - 产地农产品产销协同平台{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2>用户注册</h2>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/auth/register">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" id="name" name="name" required placeholder="请输入真实姓名">
            </div>
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="text" id="phone" name="phone" required placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label for="role">角色</label>
                <select id="role" name="role" required>
                    <option value="farmer">农户</option>
                    <option value="warehouse">仓管</option>
                    <option value="distribution">分销商</option>
                    <option value="logistics">物流人员</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
        <p class="auth-link">已有账号？<a href="/auth/login">立即登录</a></p>
    </div>
</div>
{% endblock %}
